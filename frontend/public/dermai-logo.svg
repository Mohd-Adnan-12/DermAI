<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="dermGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="coreCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left, centered vertically at x=40, y=40, width=64) -->
  <g transform="translate(10, 8) scale(0.64)">
    <!-- Shield / Cell outline -->
    <path d="M 50,6 C 74,6 92,20 92,44 C 92,68 72,92 50,96 C 28,92 8,68 8,44 C 8,20 26,6 50,6 Z" 
          fill="url(#dermGrad)" />
    <!-- Inner depth -->
    <path d="M 50,11 C 70,11 86,23 86,44 C 86,65 68,87 50,90 C 32,87 14,65 14,44 C 14,23 30,11 50,11 Z" 
          fill="#0a192f" fill-opacity="0.16" />
    <!-- Cross bars -->
    <rect x="24" y="42" width="52" height="16" rx="8" fill="url(#coreCross)" />
    <rect x="42" y="24" width="16" height="52" rx="8" fill="url(#coreCross)" />
    <!-- Nodes -->
    <circle cx="50" cy="50" r="5" fill="#0d9488" />
    <circle cx="32" cy="50" r="3" fill="#0284c7" />
    <circle cx="68" cy="50" r="3" fill="#0284c7" />
    <circle cx="50" cy="32" r="3" fill="#10b981" />
    <circle cx="50" cy="68" r="3" fill="#10b981" />
    <!-- Synapses -->
    <line x1="32" y1="50" x2="45" y2="50" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
    <line x1="55" y1="50" x2="68" y2="50" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="32" x2="50" y2="45" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="55" x2="50" y2="68" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
    <!-- Accents -->
    <circle cx="76" cy="24" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="24" cy="74" r="2.5" fill="#34d399" filter="url(#glow)" />
  </g>

  <!-- TYPOGRAPHY -->
  <text x="86" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#0f172a">
    Derm<tspan fill="url(#aiGrad)">AI</tspan>
  </text>
  <text x="88" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.2" fill="#0284c7" text-transform="uppercase">
    Clinical Intelligence
  </text>
</svg>